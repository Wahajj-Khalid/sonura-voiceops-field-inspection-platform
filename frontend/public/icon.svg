<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sonuraGradientPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sonuraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Container -->
  <rect
    x="1.5"
    y="1.5"
    width="33"
    height="33"
    rx="10"
    fill="#0b0f19"
    stroke="url(#sonuraGlow)"
    stroke-width="1.5"
  />

  <!-- Resonant S-Wave Acoustic Bars -->
  <rect x="8" y="14" width="3" height="8" rx="1.5" fill="url(#sonuraGradientPrimary)" opacity="0.6" />
  <rect x="13.5" y="10" width="3" height="16" rx="1.5" fill="url(#sonuraGradientPrimary)" opacity="0.85" />
  <rect x="19" y="8" width="3" height="20" rx="1.5" fill="url(#sonuraGradientPrimary)" />
  <rect x="24.5" y="13" width="3" height="10" rx="1.5" fill="url(#sonuraGradientPrimary)" opacity="0.7" />

  <!-- Central Harmonic Acoustic Dot -->
  <circle cx="20.5" cy="18" r="1.8" fill="#ffffff" />
</svg>